name: Migration CI

on:
  push:
    branches: ["migration-vite-flare"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Generate Cloudflare binding types
        run: pnpm exec wrangler types

      - run: pnpm build

      - run: pnpm build:marketing

      - name: Upload public site artifact
        uses: actions/upload-artifact@v4
        with:
          name: gara-radar-marketing-dist
          path: dist-marketing
          if-no-files-found: error
          retention-days: 1

      - name: Validate D1 migrations locally
        run: |
          pnpm exec wrangler d1 migrations apply gara-radar-db --local
          pnpm exec wrangler d1 execute gara-radar-db --local --command "SELECT count(*) AS sources FROM gr_sources; SELECT count(*) AS segments FROM gr_segments;"
